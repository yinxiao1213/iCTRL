name: threads-saver

on:
  push:
    branches: [threads-saver]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: threads-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE: /Applications/Xcode_27.1.app
  TAG: threads-saver

jobs:
  shortcut:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Check Threads format
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONIOENCODING=utf-8 python3 threads-saver/check_live.py 2>&1 | tee live.txt

      - name: Build and sign
        run: |
          set -o pipefail
          mkdir -p out
          for mode in rename base64 direct; do
            python3 threads-saver/build_shortcut.py "out/ts-$mode-unsigned.shortcut" --html-mode "$mode"
            PYTHONIOENCODING=utf-8 python3 threads-saver/sign.py "out/ts-$mode-unsigned.shortcut" "out/ts-$mode.shortcut" --hubsign 2>&1 | tee -a sign.log
          done

      - name: Publish signed files
        if: always()
        run: |
          touch live.txt sign.log
          printf '%s signing %s\n' "$GITHUB_SHA" "${{ job.status }}" > status.txt
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Threads 保存捷徑" --notes "由 GitHub Actions 從 threads-saver 分支產生。" --target "$GITHUB_SHA"
          FILES="status.txt live.txt sign.log"
          for f in out/ts-rename.shortcut out/ts-base64.shortcut out/ts-direct.shortcut; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          gh release upload "$TAG" $FILES --clobber

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build for the simulator
        run: |
          set -o pipefail
          IDEVICE_WITH_SIM=1 bash Scripts/fetch-idevice.sh
          xcodegen generate --quiet
          ./Scripts/stamp-build.sh
          xcodebuild build-for-testing -project iCTRL.xcodeproj -scheme iCTRL \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee sim-build.log

      - name: Run in the Shortcuts app
        run: bash Tests/sim/run-shortcut.sh "https://github.com/${{ github.repository }}/releases/download/$TAG" sim-out

      - name: Publish result
        if: always()
        run: |
          mkdir -p sim-out
          touch sim-build.log
          grep -E "error:|\*\* .* \*\*" sim-build.log | sort -u | head -100 > sim-out/build-errors.txt || true
          [ -f sim-out/runner.log ] && tail -c 200000 sim-out/runner.log > sim-out/runner.tail && mv sim-out/runner.tail sim-out/runner.log
          printf '%s %s\n' "$GITHUB_SHA" "${{ job.status }}" > status.txt
          tar czf sim-report.tgz -C sim-out .
          FILES="status.txt sim-report.tgz"
          if [ -f sim-out/winner.txt ]; then
            # 給使用者的就是模擬器實測過的同一個檔案。
            cp "out/ts-$(cat sim-out/winner.txt).shortcut" out/ThreadsSaver.shortcut
            FILES="$FILES out/ThreadsSaver.shortcut"
          fi
          gh release upload "$TAG" $FILES --clobber
