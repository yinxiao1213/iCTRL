name: build

on:
  push:
    branches: [script-recorder]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the official iCTRL releases are built with.
  XCODE: /Applications/Xcode_27.1.app

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | tee env.log
          xcrun --sdk iphoneos --show-sdk-version | tee -a env.log

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Engine tests
        run: |
          set -o pipefail
          bash Scripts/test-script-engine.sh 2>&1 | tee build.log

      - name: Build
        run: |
          set -o pipefail
          make ipa UNSIGNED=1 2>&1 | tee -a build.log

      - name: Publish
        if: always()
        run: |
          touch build.log env.log
          grep -E "error:|FAIL |passed$|BUILD (SUCCEEDED|FAILED)|\*\* .* \*\*|^make: |❌|🔴" build.log | sort -u | head -300 > errors.txt || true
          tail -c 3000000 build.log > build-tail.log
          printf '%s %s\n' "$GITHUB_SHA" "${{ job.status }}" > status.txt
          gh release view ci >/dev/null 2>&1 || gh release create ci --prerelease --title "Latest build" --notes "Built by GitHub Actions from the script-recorder branch." --target "$GITHUB_SHA"
          FILES="status.txt errors.txt env.log build-tail.log"
          for f in release/iCTRL.ipa release/iCTRLUITests-Runner.ipa; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          gh release upload ci $FILES --clobber

  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build for the simulator
        run: |
          set -o pipefail
          IDEVICE_WITH_SIM=1 bash Scripts/fetch-idevice.sh
          xcodegen generate --quiet
          ./Scripts/stamp-build.sh
          xcodebuild build-for-testing -project iCTRL.xcodeproj -scheme iCTRL \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee sim-build.log

      - name: Run on the simulator
        run: bash Tests/sim/run.sh sim-out

      - name: Publish
        if: always()
        run: |
          mkdir -p sim-out
          touch sim-build.log
          grep -E "error:|\*\* .* \*\*" sim-build.log | sort -u | head -100 > sim-out/build-errors.txt || true
          for f in sim-out/runner-*.log; do [ -f "$f" ] && tail -c 200000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          printf '%s %s\n' "$GITHUB_SHA" "${{ job.status }}" > sim-out/status.txt
          tar czf sim-report.tgz -C sim-out .
          printf '%s %s\n' "$GITHUB_SHA" "${{ job.status }}" > sim-status.txt
          gh release view ci >/dev/null 2>&1 || gh release create ci --prerelease --title "Latest build" --notes "Built by GitHub Actions from the script-recorder branch." --target "$GITHUB_SHA"
          gh release upload ci sim-report.tgz sim-status.txt --clobber
